<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>USER</title>

</head>

<body class="bg-light">

    <nav class="navbar navbar-light bg-primary " style="margin-bottom: 20px;">
        <div class="container">
            <h2 class="text-center text-white" >User Management System</h2>
        </div>
    </nav>

    <main class="container">
        <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

        <form id="new_user_form" class="card shadow border-0 card-body p-4">

             
            <h4 class="text-center fw-bold" style="margin-top: 20px;">Add New User</h4>

            <label for="name">Name : </label><br>
            <input type="text" class="form-control" id="name" name="name" placeholder="Enter your name" required><br>

            <label for="about">About you : </label><br>
            <textarea type="text" class="form-control" id="about" placeholder="Tell us about yourself"
                required></textarea><br>

            <label for="birthday">Birthday : </label><br>
            <input type="date" class="form-control" id="birthday" required><br>

            <label for="mobile_no">Mobile no : </label><br>
            <input type="tel" class="form-control" id="mobile_no" name="mobile_no" required maxlength="10"
                pattern="[0-9]{10}"><br>

            <label for="email">Email :</label><br>
            <input type="email" class="form-control" id="email" name="email" required><br>

            <label for="country">Country :</label><br>
            <select id="country" name="country" class="form-control" required>
                <option value="Sri Lanka">Sri Lanka</option>
                <option value="india">India</option>
                <option value="Australia">Australia</option>
                <option value="America">America</option>
                <option value="United Kingdom">United Kingdom</option>
            </select>

            <button type="submit" class="btn btn-primary w-100 d-inline" style="margin-top: 30px;">Add User</button>

        </form>
            <button type="submit" class="btn btn-white w-100 d-block border border-primary rounded-5px" style="margin-top: 30px ;">View Users</button>


        </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
