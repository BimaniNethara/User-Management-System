<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>User Management System</title>
</head>

<body class="bg-light">
    <div id="alertContainer"></div>

    <!--Navigation Bar-->
    <nav class="navbar bg-primary">
        <div class="container justify-content-center">
            <h2 class="text-white">User Management System</h2>
        </div>
    </nav>

    <main class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <!--form-->
                <form id="edit_user_form" class="card shadow border-0 p-4">
                    
                    <!--Form heading-->
                    <h3 class="text-center mb-4">
                        Edit User
                    </h3>

                    <!--Name field-->
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control mb-3" id="name" required>

                    <!--about field-->
                    <label for="about" class="form-label">About You</label>
                    <textarea class="form-control mb-3" id="about" required></textarea>

                    <!--birthday field-->
                    <label for="birthday" class="form-label">Birthday</label>
                    <input type="date" class="form-control mb-3" id="birthday" required>

                    <!--Mobile number field-->
                    <label for="mobile" class="form-label">Mobile Number</label>
                    <input type="tel" class="form-control mb-3" id="mobile" maxlength="10" pattern="[0-9]{10}" required>

                    <!--Email field-->
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control mb-3" id="email" required>

                    <!--country field-->
                    <label for="country" class="form-label">Country</label>
                    <select id="country" class="form-select mb-4" required>

                        <option value="Sri Lanka">Sri Lanka</option>
                        <option value="India">India</option>
                        <option value="Australia">Australia</option>
                        <option value="America">America</option>
                        <option value="United Kingdom">United Kingdom</option>

                    </select>

                    <!--Update button field-->
                    <button type="submit" class="btn btn-primary w-100">
                        Update User
                    </button>

                </form>

            </div>

        </div>

    </main>

    <!--Javascript file-->
    <script src="js/edit.js"></script>


</body>

</html>
