<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <title>User Management System</title>
</head>
<body>
    <div id="alertContainer"></div>
    <nav class="navbar bg-primary">
        <div class="container justify-content-center">
            <h2 class="text-white">User Management System</h2>
        </div>
    </nav>

    <main class="container mt-4">
        <div class="card shadow border-0 p-4">

            <!--heading-->
            <h3 class="text-center mb-4">All Users</h3>

            <!--Filter-->

            <!--Filter by Country-->
            <div class="row mb-4 mb-4">
                <div class="col-4">
                    <label for="country_filter" class="form-label">
                        Country
                    </label>

                    <select id="country_filter" class="form-select">
                        <option value="">All Countries</option>
                        <option value="Sri Lanka">Sri Lanka</option>
                        <option value="India">India</option>
                        <option value="Australia">Australia</option>
                        <option value="America">America</option>
                        <option value="United Kingdom">United Kingdom</option>
                    </select>
                </div>

                <!--Filter by Birthday-->
                <div class="col-3 ">
                    <label for="birthday_from" class="form-label">Birthday from</label>
                    <input type="date" id="birthday_from" class="form-control">
                </div>

                <div class="col-3">
                    <label for="birthday_to" class="form-label">Birthday to</label>
                    <input type="date" id="birthday_to" class="form-control">
                </div>

                <!--Filter buttons-->
                <div class="col-1 d-flex align-items-end">
                    <button type="button" id="filter_button" class="btn btn-primary w-100">Filter</button>
                </div>

                <!--Clear Filter buttons-->
                <div class="col-1 d-flex align-items-end">
                    <button type="button" id="reset_button" class="btn btn-primary w-100">Clear</button>
                </div>
            </div>
            <div id="user_list">
                <!-- Users list -->
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <!--JavaScript file-->
    <script src="js/users.js"></script>
</body>
</html>
